name: retail_retention
version: "1.0.0"
config-version: 2

profile: retail_retention

model-paths: ["models"]
test-paths: ["tests"]

vars:
  reactivation_days: 90
  customer_snapshot_date: "2011-12-01"
  customer_window_start: "2010-12-01"
  at_risk_days: 90
  recent_customer_days: 30
  repeat_order_threshold: 4
  high_value_percentile: 0.75
  
models:
  retail_retention:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table